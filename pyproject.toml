[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swan-transpiler"
version = "0.3.0"
description = "Swan programming language source-to-source transpiler"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
swan = "swan:main"

[tool.setuptools]
package-dir = {"" = "lib"}
py-modules = ["swan"]
