name: Swan vs Goose 100M Hello World Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "compiler-c/**"
      - "build.sh"
      - "benchmarks/hello_100m.py"
      - ".github/workflows/hello-100m.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Swan
        uses: actions/checkout@v4
        with:
          path: swan

      - name: Check out Goose
        uses: actions/checkout@v4
        with:
          repository: aardappel/goose
          path: goose

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake python3 time

      - name: Build Swan
        working-directory: swan
        run: sh build.sh

      - name: Build Goose
        run: |
          cmake -S goose -B goose/build -DCMAKE_BUILD_TYPE=Release
          cmake --build goose/build --parallel 2

      - name: Run 100-million-line benchmark
        run: python3 swan/benchmarks/hello_100m.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmark-results/results.md ]; then
            cat swan/benchmark-results/results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark did not produce results. Inspect the preceding build or run step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swan-goose-hello-100m-results
          path: |
            swan/benchmark-results/results.md
            benchmark-results/results.json
          if-no-files-found: warn
