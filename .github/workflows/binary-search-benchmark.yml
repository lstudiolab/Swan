name: Binary Search Benchmark
# Deterministic search workload; rerun after Goose constant fix.
on:
  push:
    paths:
      - "benchmarks/binary_search.swan"
      - "benchmarks/binary_search.py"
      - ".github/workflows/binary-search-benchmark.yml"
      - "compiler/**"
      - "build.sh"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Goose
        shell: bash
        run: |
          curl -fsSL https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz -o /tmp/goose.tar.gz
          mkdir -p /tmp/goose-dist
          tar -xzf /tmp/goose.tar.gz -C /tmp/goose-dist
          GOOSE_BIN="$(find /tmp/goose-dist -type f -name goose -perm -u+x | head -n 1)"
          test -n "$GOOSE_BIN"
          echo "GOOSE=$GOOSE_BIN" >> "$GITHUB_ENV"
          "$GOOSE_BIN" version
      - name: Build Swan compiler
        run: sh build.sh
      - name: Run 20M x 20M benchmark
        run: python3 benchmarks/binary_search.py
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: binary-search-benchmark
          path: binary-search-benchmark.json
          if-no-files-found: error
