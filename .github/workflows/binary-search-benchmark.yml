name: Binary Search Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"
      - name: Install Goose
        shell: bash
        run: |
          curl -fsSL https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz -o /tmp/goose.tar.gz
          mkdir -p /tmp/goose-dist
          tar -xzf /tmp/goose.tar.gz -C /tmp/goose-dist
          GOOSE_BIN="$(find /tmp/goose-dist -type f -name goose -perm -u+x | head -n 1)"
          test -n "$GOOSE_BIN"
          echo "GOOSE=$GOOSE_BIN" >> "$GITHUB_ENV"
          "$GOOSE_BIN" version
      - name: Record benchmark machine
        run: |
          lscpu
          free -h
          uname -a
          cc --version
          rustc --version
          go version
          zig version
      - name: Build Swan compiler
        run: sh build.sh
      - name: Run balanced 20M x 20M benchmark
        run: python3 benchmarks/binary_search.py
      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f binary-search-benchmark.json ]; then
            cat binary-search-benchmark.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark failed before producing results; inspect the preceding logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark report and generated Swan assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-search-benchmark
          path: |
            binary-search-benchmark.json
            binary-search-swan-checked.s
            binary-search-swan-unchecked.s
          if-no-files-found: warn
