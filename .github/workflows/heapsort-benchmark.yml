name: 1B Heapsort Language Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/heapsort/**"
      - "benchmarks/heapsort_benchmark.py"
      - "compiler/lib/CodeGen/Targets/WASM32.h"
      - ".github/workflows/heapsort-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: heapsort-1b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: 1B heapsort (Swan, Goose, Rust, C, C++, Swift)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out Swan
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Swan compiler
        run: sh build.sh

      - name: Check out Goose compiler
        uses: actions/checkout@v4
        with:
          repository: lstudiolab/goose
          ref: master
          path: goose

      - name: Build Goose compiler
        working-directory: goose
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build --config Release --parallel 2

      - name: Record runner resources
        run: |
          uname -a
          lscpu
          free -h
          df -h .

      - name: Run benchmark
        env:
          SWAN: ${{ github.workspace }}/build/swanc
          GOOSE: ${{ github.workspace }}/goose/build/goose
        run: python3 benchmarks/heapsort_benchmark.py

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heapsort-1b-results
          path: heapsort-benchmark.json
          if-no-files-found: warn
          retention-days: 90
