name: Brew Release Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x86_64
          - os: ubuntu-24.04-arm
            asset: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Brew compiler
        run: |
          sh build.sh
          ./build/brewc --version
          ./build/brewc --list-targets

      - name: Package Linux compiler
        run: |
          mkdir -p dist/brew/bin
          cp build/brewc dist/brew/bin/brewc
          cp README.md dist/brew/
          cp -R stdlib dist/brew/
          tar -C dist -czf "brew-${{ matrix.asset }}.tar.gz" brew

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: brew-${{ matrix.asset }}
          path: brew-${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
