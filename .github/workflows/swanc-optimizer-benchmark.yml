name: Swan Compiler 2 Optimizer

on:
  push:
    branches: [main]
    paths:
      - 'swanc/**'
      - 'tests/swanc-optimizer.sh'
      - 'tests/swanc_optimizer.c'
      - 'benchmarks/swanc_optimizer.py'
      - 'build.sh'
      - 'main.c'
      - '.github/workflows/swanc-optimizer-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer-correctness-and-benchmark:
    name: Optimizer correctness and performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record host and revision
        run: |
          echo "Revision: $(git rev-parse HEAD)"
          uname -a
          cc --version | head -n 1
          python3 --version
      - name: Build Compiler 1 bootstrap
        run: sh build.sh
      - name: Run Compiler 2 optimizer regression suite
        run: sh tests/swanc-optimizer.sh
      - name: Benchmark Swan-authored optimizer
        run: python3 benchmarks/swanc_optimizer.py --warmups 3 --repeats 15 --output-dir benchmark-results
      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmark-results/swanc-optimizer.md ]; then
            cat benchmark-results/swanc-optimizer.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No optimizer benchmark report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swanc-optimizer-benchmark
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 90
