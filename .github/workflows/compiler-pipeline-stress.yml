name: Swan Compiler Pipeline Stress Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/compiler_pipeline_stress.py'
      - 'compiler/**'
      - 'main.c'
      - 'build.sh'
      - '.github/workflows/compiler-pipeline-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Swan compiler
        run: sh build.sh
      - name: Run fresh compiler pipeline stress benchmark
        run: python3 benchmarks/compiler_pipeline_stress.py --repeats 5 --warmups 2 | tee compiler-pipeline-stress.txt
      - name: Upload stress benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: swan-compiler-pipeline-stress
          path: compiler-pipeline-stress.txt
          if-no-files-found: error
