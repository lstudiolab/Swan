name: Swan CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  transpiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run transpiler tests
        run: PYTHONPATH=lib python -m unittest discover -s tests -v
      - name: Install Python package and CLI
        run: python -m pip install --no-deps .
      - name: Verify installed CLI
        run: swan --version
      - name: Transpile smoke test
        run: |
          mkdir -p build
          swan examples/hello.swan -o build/hello.c
      - name: Compile and run emitted C (test only)
        run: |
          cc -std=c11 -Wall -Wextra -Werror build/hello.c -o build/hello
          test "$(build/hello)" = "Hello from Swan"
