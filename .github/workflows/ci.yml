name: Swan CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-c11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Wasmtime with memory64 support
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.2/wasmtime-v50.0.2-x86_64-linux.tar.xz -o "$RUNNER_TEMP/wasmtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v50.0.2-x86_64-linux" >> "$GITHUB_PATH"
      - name: Run complete compiler and standard-library test suite
        run: sh test.sh
      - name: Verify production x86-64 IR backend
        run: sh tests/x86-ir.sh
      - name: Verify shared keyword semantics across supported targets
        run: sh tests/keyword-targets.sh
      - name: Verify typed SSA IR
        run: sh tests/ir.sh
      - name: Verify Swift-style SIL generation, verification, and optimization
        run: sh tests/sil.sh
      - name: Verify IR optimization passes
        run: sh tests/optimization.sh
      - name: Verify .swan to optimized typed-IR integration
        run: sh tests/irgen.sh
      - name: Verify IR control-flow lowering
        run: sh tests/irgen-control.sh
      - name: Verify AArch64 ELF emission
        run: sh tests/aarch64.sh
      - name: Verify scalar WASM64 binary emission
        run: sh tests/wasm64.sh
      - name: Verify one assembly and object per source file
        run: sh tests/multi-source.sh
      - name: Verify direct single-compiler build
        run: sh tests/compiler-single-build.sh
      - name: Verify compiler version
        run: ./build/swanc --version

  memory-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler with AddressSanitizer and UndefinedBehaviorSanitizer
        run: SWAN_SANITIZE=1 sh build.sh
      - name: Exercise C ABI, JSON handles, and native linking
        run: sh tests/ffi.sh
      - name: Exercise independent source translation units
        run: sh tests/multi-source.sh

  compiler-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Wasmtime with memory64 support
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.2/wasmtime-v50.0.2-aarch64-linux.tar.xz -o "$RUNNER_TEMP/wasmtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v50.0.2-aarch64-linux" >> "$GITHUB_PATH"
      - name: Build compiler on native ARM64
        run: sh build.sh
      - name: Execute native ARM64 Swan programs
        run: sh tests/arm64-native.sh
      - name: Verify AArch64 object and ABI lowering
        run: sh tests/aarch64.sh
      - name: Execute WASM64 artifacts on ARM64
        run: sh tests/wasm-runtime.sh
      - name: Verify target-independent IR and optimization
        run: |
          sh tests/ir-verifier.sh
          sh tests/irgen-control.sh
          sh tests/optimization.sh
