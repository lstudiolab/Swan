name: Swan CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-c11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run complete compiler and standard-library test suite
        run: sh test.sh
      - name: Verify production x86-64 IR backend
        run: sh tests/x86-ir.sh
      - name: Verify typed SSA IR
        run: sh tests/ir.sh
      - name: Verify IR optimization passes
        run: sh tests/optimization.sh
      - name: Verify .swan to optimized typed-IR integration
        run: sh tests/irgen.sh
      - name: Verify IR control-flow lowering
        run: sh tests/irgen-control.sh
      - name: Verify WASM32 binary emission
        run: sh tests/wasm32.sh
      - name: Verify scalar WASM64 binary emission
        run: sh tests/wasm64.sh
      - name: Verify AArch64 ELF emission
        run: sh tests/aarch64.sh
      - name: Verify ARMv7 ELF emission
        run: sh tests/armv7.sh
      - name: Verify RISC-V64 ELF emission
        run: sh tests/riscv64.sh
      - name: Verify arbitrary LLVM target-triple backend
        run: sh tests/llvm-target.sh
      - name: Verify Compiler 2 optimizer slice
        run: sh tests/swanc-optimizer.sh
      - name: Verify Compiler 2 ownership and borrowing slice
        run: sh tests/swanc-ownership.sh
      - name: Verify Compiler 2 control-flow graph verifier
        run: sh tests/swanc-cfg.sh
      - name: Verify compiler version
        run: ./build/swan --version
