name: Swan CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native C++20 compiler
        run: sh build.sh
      - name: Run compiler tests
        run: sh test.sh
      - name: Verify fast native build
        run: |
          sh compile.sh examples/hello.swan build/hello-fast
          test "$(./build/hello-fast)" = "Hello from Swan"
      - name: Verify CLI version
        run: ./build/swan --version
