name: Swan CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone C11 compiler
        run: sh build.sh
      - name: Verify native execution and architecture assembly
        run: sh tests/c-compiler.sh
      - name: Verify compiler version
        run: ./build/swan --version
