name: Swan CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compiler tests
        run: PYTHONPATH=Compiler/Python python -m unittest discover -s Compiler/Python/tests -v
      - name: Transpile smoke test
        run: |
          mkdir -p build
          PYTHONPATH=Compiler/Python python -m swan_compiler.cli Compiler/Python/tests/hello.swan -o build/hello.c
      - name: Compile and run emitted C (test only)
        run: |
          cc -std=c11 -Wall -Wextra -Werror build/hello.c -o build/hello
          test "$(build/hello)" = "Hello from Swan"
