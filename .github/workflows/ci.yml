name: Swan CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM backend
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build Swan compiler
        run: sh build.sh
      - name: Verify Swan language features and regressions
        run: |
          sh tests/smoke.sh
          sh tests/regressions.sh
          sh tests/architecture.sh
      - name: Verify compiler version
        run: ./build/swan --version
