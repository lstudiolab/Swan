name: Swan CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native C++20 compiler
        run: ./build.sh
      - name: Run compiler tests
        run: ./test.sh
      - name: Verify CLI version
        run: ./build/swan --version
