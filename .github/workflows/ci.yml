name: Swan CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 GNU assembler
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Build Swan compiler
        run: sh build.sh
      - name: Verify standalone headers
        run: sh tests/headers.sh
      - name: Verify native assembly backend
        run: |
          sh tests/smoke.sh
          sh tests/regressions.sh
          sh tests/architecture.sh
      - name: Verify compiler version
        run: ./build/swan --version
