name: Swan Compiler Pipeline Benchmark

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - "tests/pipeline_benchmark.inc"
      - "build.sh"
      - ".github/workflows/pipeline-benchmark.yml"
  pull_request:
    paths:
      - "compiler/**"
      - "tests/pipeline_benchmark.inc"
      - "build.sh"
      - ".github/workflows/pipeline-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pre-optimization baseline
        uses: actions/checkout@v4
        with:
          ref: 8a7e0817048b0fc6bc8f29e75dc7b51a4cebc5c8
          path: baseline

      - name: Build both compilers and benchmark harnesses
        run: |
          set -eu
          (
            cd baseline
            sh build.sh
            c++ -x c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
              -Icompiler/include tests/pipeline_benchmark.inc \
              -o build/pipeline-benchmark
          )
          sh build.sh
          c++ -x c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            -Icompiler/include tests/pipeline_benchmark.inc \
            -o build/pipeline-benchmark
          lscpu | grep -E 'Model name|CPU\\(s\\)' | head -n 2
          c++ --version | head -n 1
          cc --version | head -n 1

      - name: Alternate baseline and optimized measurements
        run: |
          set -eu
          for repetition in 1 2 3; do
            baseline_dir="baseline/build/measure-$repetition"
            optimized_dir="build/measure-$repetition"
            if [ "$((repetition % 2))" -eq 1 ]; then
              (cd baseline && ./build/pipeline-benchmark "build/measure-$repetition" > "build/measure-$repetition.csv")
              ./build/pipeline-benchmark "$optimized_dir" > "$optimized_dir.csv"
            else
              ./build/pipeline-benchmark "$optimized_dir" > "$optimized_dir.csv"
              (cd baseline && ./build/pipeline-benchmark "build/measure-$repetition" > "build/measure-$repetition.csv")
            fi
          done

      - name: Aggregate medians across alternating runs
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          from statistics import median

          fields = [
              "lex_ms", "parse_ms", "sema_ms", "codegen_ms",
              "frontend_ms", "c_compile_ms", "swan_total_ms",
              "generated_c_bytes",
          ]

          def aggregate(root, pattern, destination):
              paths = sorted(Path(root).glob(pattern))
              if len(paths) != 3:
                  raise SystemExit(f"expected 3 measurements for {root}, found {len(paths)}")
              rows = []
              for path in paths:
                  with path.open(newline="", encoding="utf-8") as source:
                      rows.append({int(row["statements"]): row for row in csv.DictReader(source)})
              statement_counts = sorted(rows[0])
              with destination.open("w", newline="", encoding="utf-8") as output:
                  writer = csv.writer(output)
                  writer.writerow([
                      "statements", "source_bytes", "tokens", *fields
                  ])
                  for count in statement_counts:
                      samples = [run[count] for run in rows]
                      first = samples[0]
                      writer.writerow([
                          count, first["source_bytes"], first["tokens"],
                          *[f"{median(float(row[field]) for row in samples):.3f}" for field in fields],
                      ])

          aggregate("baseline/build", "measure-*.csv", Path("baseline/build/pipeline-baseline.csv"))
          aggregate("build", "measure-*.csv", Path("build/pipeline-results.csv"))
          print("Baseline medians:")
          print(Path("baseline/build/pipeline-baseline.csv").read_text())
          print("Optimized medians:")
          print(Path("build/pipeline-results.csv").read_text())
          PY

      - name: Preserve benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: swan-pipeline-benchmark
          path: |
            build/pipeline-results.csv
            build/measure-1/pipeline-8192.c
            baseline/build/pipeline-baseline.csv
            baseline/build/measure-1/pipeline-8192.c
          retention-days: 30
