name: Swan vs Goose benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark.yml"
      - "benchmarks/compare_goose.py"
      - "compiler/**"
      - "main.cpp"
      - "build.sh"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Build Swan compiler
        run: sh build.sh

      - name: Build Goose compiler
        run: |
          git clone --depth 1 https://github.com/aardappel/goose.git "$RUNNER_TEMP/goose"
          cmake -S "$RUNNER_TEMP/goose" -B "$RUNNER_TEMP/goose-build" -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build "$RUNNER_TEMP/goose-build" --parallel 2

      - name: Compare identical workload
        env:
          GOOSE_BIN: ${{ runner.temp }}/goose-build/goose
          GOOSE_HOME: ${{ runner.temp }}/goose-home
          GOOSE_CC: cc
          CC: cc
        run: python3 benchmarks/compare_goose.py

      - name: Record benchmark environment
        if: always()
        run: |
          {
            echo "Swan commit: $(git rev-parse HEAD)"
            echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "Kernel: $(uname -sr)"
            echo "C compiler: $(cc --version | head -1)"
            echo "C++ compiler: $(c++ --version | head -1)"
            echo "Goose commit: $(git -C "$RUNNER_TEMP/goose" rev-parse HEAD 2>/dev/null || echo unavailable)"
          } | tee benchmark-environment.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swan-goose-benchmark-environment
          path: benchmark-environment.txt
