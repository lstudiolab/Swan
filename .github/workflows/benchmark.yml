name: Swan C compiler benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "compiler-c/**"
      - "benchmarks/benchmark_c.py"
      - ".github/workflows/benchmark.yml"
      - "build.sh"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build C compiler
        run: sh build.sh
      - name: Run repeated benchmark
        run: python3 benchmarks/benchmark_c.py | tee benchmark-results.txt
      - name: Record environment
        run: |
          {
            echo "Commit: $(git rev-parse HEAD)"
            echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "Kernel: $(uname -sr)"
            echo "C compiler: $(cc --version | head -1)"
          } | tee -a benchmark-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: swan-c-compiler-benchmark
          path: benchmark-results.txt
