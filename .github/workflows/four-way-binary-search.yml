name: Four-language binary-search benchmark

on:
  push:
    branches:
      - main
    paths:
      - benchmarks/four_way_binary_search.py
      - .github/workflows/four-way-binary-search.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Goose
        shell: bash
        run: |
          curl -fsSL https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz -o /tmp/goose.tar.gz
          mkdir -p /tmp/goose-dist
          tar -xzf /tmp/goose.tar.gz -C /tmp/goose-dist
          GOOSE_BIN="$(find /tmp/goose-dist -type f -name goose -perm -u+x | head -n 1)"
          test -n "$GOOSE_BIN"
          echo "GOOSE=$GOOSE_BIN" >> "$GITHUB_ENV"
          "$GOOSE_BIN" version
      - name: Record machine and toolchains
        run: |
          lscpu
          free -h
          uname -a
          cc --version
          rustc --version
      - name: Build Swan
        run: sh build.sh
      - name: Run identical four-language benchmark
        run: python3 benchmarks/four_way_binary_search.py
      - name: Publish report
        if: always()
        run: |
          if [ -f four-way-binary-search.json ]; then
            cat four-way-binary-search.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark failed before producing a report; inspect the job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-way-binary-search
          path: four-way-binary-search.json
          if-no-files-found: warn
